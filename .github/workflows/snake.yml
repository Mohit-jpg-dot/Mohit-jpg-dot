name: Generate Snake

on:
  schedule:
    # Triggers the generation every 12 hours automatically
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # CRITICAL FIX 1: Must checkout the repository workspace first
      - name: Checkout Repository
        uses: actions/checkout@v4

      # CRITICAL FIX 2: Optimized Generation Parameters with palette definitions
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Mohit-jpg-dot
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CRITICAL FIX 3: Fully isolated deployment block targeting the output branch
      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
